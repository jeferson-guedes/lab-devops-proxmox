---
# Plano B — constrói o template Proxmox (VM 9000) a partir do cloud image Ubuntu 24.04.
# Idempotente: se VM 9000 já existe, pula tudo.
#
# Uso:
#   ansible-playbook \
#     -i infra/ansible-k3s/inventory/hosts.yml \
#     -i infra/ansible-proxmox/inventory.yml \
#     infra/ansible-proxmox/template.yml

- name: Construir template Ubuntu 24.04 no Proxmox (VM 9000)
  hosts: proxmox
  become: true
  vars:
    template_vmid: 9000
    template_name: ubuntu-2404-template
    cloud_image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    cloud_image_path: /root/noble-server-cloudimg-amd64.img
    storage: local-lvm
    bridge: vmbr0
    template_memory: 2048
    template_cores: 2
  tasks:
    - name: Verificar se a VM {{ template_vmid }} já existe
      ansible.builtin.command: "qm status {{ template_vmid }}"
      register: tpl_check
      failed_when: false
      changed_when: false

    - name: Construir template (apenas se não existe)
      when: tpl_check.rc != 0
      block:
        - name: Instalar libguestfs-tools
          ansible.builtin.apt:
            name: libguestfs-tools
            state: present
            update_cache: false

        - name: Baixar Ubuntu 24.04 cloud image
          ansible.builtin.get_url:
            url: "{{ cloud_image_url }}"
            dest: "{{ cloud_image_path }}"
            mode: '0644'

        - name: virt-customize — instalar qemu-guest-agent na imagem
          ansible.builtin.command:
            cmd: >
              virt-customize -a {{ cloud_image_path }}
              --install qemu-guest-agent
              --run-command 'systemctl enable qemu-guest-agent'
            creates: "{{ cloud_image_path }}.customized"

        - name: Marcar imagem como já customizada
          ansible.builtin.file:
            path: "{{ cloud_image_path }}.customized"
            state: touch
            mode: '0644'

        - name: qm create — VM base
          ansible.builtin.command: >
            qm create {{ template_vmid }}
            --name {{ template_name }}
            --memory {{ template_memory }}
            --cores {{ template_cores }}
            --net0 virtio,bridge={{ bridge }}

        - name: qm importdisk — importar disco do cloud image
          ansible.builtin.command: "qm importdisk {{ template_vmid }} {{ cloud_image_path }} {{ storage }}"

        - name: qm set — SCSI controller + disco principal
          ansible.builtin.command: >
            qm set {{ template_vmid }}
            --scsihw virtio-scsi-pci
            --scsi0 {{ storage }}:vm-{{ template_vmid }}-disk-0

        - name: qm set — drive cloud-init
          ansible.builtin.command: "qm set {{ template_vmid }} --ide2 {{ storage }}:cloudinit"

        - name: qm set — boot do disco principal
          ansible.builtin.command: "qm set {{ template_vmid }} --boot c --bootdisk scsi0"

        - name: qm set — console serial
          ansible.builtin.command: "qm set {{ template_vmid }} --serial0 socket --vga serial0"

        - name: qm set — habilitar qemu-guest-agent
          ansible.builtin.command: "qm set {{ template_vmid }} --agent enabled=1"

        - name: qm template — converter em template
          ansible.builtin.command: "qm template {{ template_vmid }}"
