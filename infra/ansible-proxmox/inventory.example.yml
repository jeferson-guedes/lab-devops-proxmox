---
# Proxmox host — gateway/jump das VMs do cluster.
# Vars sobrescritas aqui evitam herdar o ProxyJump/ansible_user do inventory principal.
all:
  children:
    proxmox:
      hosts:
        proxmox-01:
          ansible_host: PROXMOX_IP   # ex: 192.168.15.200
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
