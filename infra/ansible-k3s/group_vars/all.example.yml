# Versão do K3s a instalar. "latest" sempre pega a mais recente estável.
# Para produção real, fixe em uma versão específica: "v1.31.1+k3s1"
k3s_version: "latest"

# IP do Master — substitua pelo IP real (definido no seu hosts.yml)
k3s_master_ip: "MASTER_IP"

# Porta da API do K3s
k3s_api_port: 6443

# Caminho onde o kubeconfig ficará na máquina local (Mac)
local_kubeconfig_path: "~/.kube/config-homelab"
