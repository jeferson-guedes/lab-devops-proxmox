all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    # Jump Host: substitua pelo IP do seu servidor Proxmox
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o ProxyJump=root@PROXMOX_IP'

k3s_master:
  hosts:
    k8s-master-01:
      ansible_host: MASTER_IP   # ex: 192.168.15.100

k3s_worker:
  hosts:
    k8s-worker-01:
      ansible_host: WORKER_IP   # ex: 192.168.15.101
