name: build-hello

# Builda a imagem da API Go (apps/hello) e publica em ghcr.io a cada push em main
# que toque os arquivos da app ou o próprio workflow. Repo público → imagem pública,
# pull do ArgoCD não precisa de imagePullSecret.

on:
  push:
    branches: [main]
    paths:
      - 'apps/hello/**'
      - '.github/workflows/build-hello.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hello
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: apps/hello
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
