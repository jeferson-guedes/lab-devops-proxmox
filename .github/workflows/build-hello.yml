name: build-hello

# Builda a imagem da API Go (apps/hello) e publica em Docker Hub a cada push em main
# que toque os arquivos da app ou o próprio workflow. Imagem pública → ArgoCD/K8s
# fazem pull sem imagePullSecret.
#
# Pré-requisito: secret DOCKER_HUB_TOKEN configurado no repo (Settings → Secrets).

on:
  push:
    branches: [main]
    paths:
      - 'apps/hello/**'
      - '.github/workflows/build-hello.yml'
  workflow_dispatch:

env:
  IMAGE: docker.io/guedesjeferson/hello-go

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: guedesjeferson
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: apps/hello
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
