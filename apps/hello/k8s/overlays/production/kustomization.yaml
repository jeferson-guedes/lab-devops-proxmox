apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Prefixo pra distinguir recursos de produção dos de outros overlays no futuro.
namePrefix: prod-

# Imagem publicada pelo workflow .github/workflows/build.yml em ghcr.io.
# Repositório público: pull não precisa de imagePullSecret.
images:
  - name: my-gitops-api
    newName: ghcr.io/jeferson-guedes/lab-devops-proxmox/hello
    newTag: latest

replicas:
  - name: my-gitops-api
    count: 3

labels:
  - pairs:
      app: my-gitops-api
    includeSelectors: true
